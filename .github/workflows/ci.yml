name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JWT_SECRET: ci-only-secret-not-used-in-production
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/backend-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
      - name: Migrations apply cleanly and match schema.prisma
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Migrations also work on a database built with db push (like production)
        run: |
          psql "$DATABASE_URL" -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          # Recreate the pre-email-verification schema with db push, no migration history
          sed '/emailVerified/d; /emailVerification /d' prisma/schema.prisma | sed '/^model EmailVerification {/,/^}/d' > /tmp/old.prisma
          npx prisma db push --schema /tmp/old.prisma --skip-generate --accept-data-loss
          psql "$DATABASE_URL" -c "INSERT INTO users (id,name,email,\"passwordHash\",role,\"updatedAt\") VALUES ('u1','Old','old@thapar.edu','x','STUDENT',now());"
          RENDER=true node scripts/migrate-on-render.js
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          test "$(psql "$DATABASE_URL" -tAc "SELECT \"emailVerified\" FROM users WHERE id='u1'")" = "t"
          echo "Existing user kept verified"
          psql "$DATABASE_URL" -tAc "INSERT INTO users (id,name,email,\"passwordHash\",role,\"updatedAt\") VALUES ('u2','New','new@thapar.edu','x','STUDENT',now()) RETURNING \"emailVerified\"" | grep -q '^f$'
          echo "New users default to unverified"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/web/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
