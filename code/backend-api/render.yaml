services:
  - type: web
    name: savoury-api
    runtime: node
    region: singapore  # closest to India
    plan: free
    rootDir: code/backend-api
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL      # e.g. https://savoury-two.vercel.app (comma-separate several)
        sync: false
      - key: SETUP_TOKEN       # only needed to create the first Super Admin; leave unset otherwise
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
