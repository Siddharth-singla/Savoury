name: mkdocs
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# GitHub Pages is configured with "Source: GitHub Actions", so the site is
# published from an uploaded artifact rather than a gh-pages branch.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the git-revision-date and git-authors plugins
          # can read commit dates and authors for every page.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install                              \
          mkdocs                                      \
          mkdocs-material                             \
          mkdocs-material-extensions                  \
          mkdocs-literate-nav                         \
          mkdocs-section-index                        \
          mkdocs-git-revision-date-localized-plugin   \
          mkdocs-git-authors-plugin                   \
          pymdown-extensions
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
